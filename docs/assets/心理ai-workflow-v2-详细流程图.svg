<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="3180" viewBox="0 0 1800 3180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#163B73"/>
      <stop offset="1" stop-color="#2463A7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#183153" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3E5D80"/>
    </marker>
    <marker id="arrowDash" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#7A6AA8"/>
    </marker>
    <style>
      .title{font:700 45px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#fff}
      .subtitle{font:400 22px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#DCEBFF}
      .lane{font:700 24px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#35506D}
      .h{font:700 25px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#17385F}
      .body{font:400 20px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#34495E}
      .small{font:400 17px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#516579}
      .dbH{font:700 21px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#42386B}
      .dbT{font:400 17px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#5B527A}
      .num{font:700 20px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#fff;text-anchor:middle}
      .tag{font:700 17px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif}
      .flow{stroke:#3E5D80;stroke-width:5;fill:none;marker-end:url(#arrow)}
      .audit{stroke:#7A6AA8;stroke-width:3;stroke-dasharray:10 8;fill:none;marker-end:url(#arrowDash)}
      .thin{stroke:#7890A8;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1800" height="3180" fill="url(#bg)"/>
  <rect x="0" y="0" width="1800" height="180" fill="url(#header)"/>
  <text x="90" y="78" class="title">心理ai workflow-v2：完整执行与存储流程</text>
  <text x="92" y="125" class="subtitle">一条 CONSULT 主路线｜实线是执行流｜紫色虚线是持久化｜Event 只审计，不驱动下一步</text>

  <rect x="90" y="205" width="1620" height="78" rx="20" fill="#FFFFFF" stroke="#D5E1EF"/>
  <circle cx="135" cy="244" r="14" fill="#DCEBFF" stroke="#2463A7" stroke-width="3"/>
  <text x="162" y="252" class="small">蓝色：Runtime 内存与流程控制</text>
  <circle cx="518" cy="244" r="14" fill="#FFF0D7" stroke="#E09A2D" stroke-width="3"/>
  <text x="545" y="252" class="small">橙色：Agent / LLM 计算</text>
  <circle cx="895" cy="244" r="14" fill="#EEE9FA" stroke="#7462A8" stroke-width="3"/>
  <text x="922" y="252" class="small">紫色：MySQL 持久化</text>
  <circle cx="1255" cy="244" r="14" fill="#E4F5EB" stroke="#419A68" stroke-width="3"/>
  <text x="1282" y="252" class="small">绿色：Redis / Chroma 数据</text>

  <rect x="80" y="320" width="1090" height="2770" rx="30" fill="#FFFFFF" stroke="#D6E2F0" stroke-width="2"/>
  <rect x="1200" y="320" width="520" height="2770" rx="30" fill="#FCFAFF" stroke="#DED6F0" stroke-width="2"/>
  <text x="120" y="370" class="lane">执行主链（Runtime 内存）</text>
  <text x="1240" y="370" class="lane">持久化与外部数据</text>

  <!-- 1 Request -->
  <g filter="url(#shadow)">
    <rect x="170" y="410" width="900" height="105" rx="20" fill="#EAF3FF" stroke="#5B91CB" stroke-width="2"/>
  </g>
  <circle cx="215" cy="462" r="25" fill="#2463A7"/><text x="215" y="470" class="num">1</text>
  <text x="260" y="451" class="h">浏览器发送请求</text>
  <text x="260" y="486" class="body">message + requestId → FastAPI / ChatService → Harness</text>

  <!-- 2 Harness -->
  <path d="M620 515 L620 555" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="565" width="900" height="125" rx="20" fill="#EAF3FF" stroke="#5B91CB" stroke-width="2"/>
  </g>
  <circle cx="215" cy="625" r="25" fill="#2463A7"/><text x="215" y="633" class="num">2</text>
  <text x="260" y="610" class="h">Harness 准备请求</text>
  <text x="260" y="647" class="body">校验输入 → 隐私脱敏得到 model_input → 取得 Session</text>
  <text x="260" y="677" class="small">这些对象先存在本次请求内存中</text>

  <g filter="url(#shadow)">
    <rect x="1250" y="540" width="420" height="150" rx="20" fill="#EEE9FA" stroke="#8C7DB8" stroke-width="2"/>
  </g>
  <text x="1285" y="582" class="dbH">MySQL：agent_runtime_leases</text>
  <text x="1285" y="617" class="dbT">requestId → owner_id</text>
  <text x="1285" y="648" class="dbT">lease_until：执行权过期时间</text>
  <path d="M1070 625 C1150 625 1170 615 1245 615" class="audit"/>

  <!-- 3 initial blackboard -->
  <path d="M620 690 L620 730" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="740" width="900" height="145" rx="20" fill="#DCEBFF" stroke="#2463A7" stroke-width="3"/>
  </g>
  <circle cx="215" cy="810" r="25" fill="#2463A7"/><text x="215" y="818" class="num">3</text>
  <text x="260" y="785" class="h">创建初始 Blackboard</text>
  <text x="260" y="822" class="body">workflow=v2｜revision=0｜stage=RECEIVED</text>
  <text x="260" y="856" class="small">understanding / safety / context / response = null｜execution = null</text>

  <!-- 4 coordinator -->
  <path d="M620 885 L620 925" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="935" width="900" height="165" rx="20" fill="#DCEBFF" stroke="#2463A7" stroke-width="3"/>
  </g>
  <circle cx="215" cy="1015" r="25" fill="#2463A7"/><text x="215" y="1023" class="num">4</text>
  <text x="260" y="975" class="h">Coordinator 创建 ANALYZING 任务</text>
  <text x="260" y="1012" class="body">cmd-understanding：UNDERSTAND，state_revision=1</text>
  <text x="260" y="1046" class="body">cmd-safety：ASSESS_RISK，state_revision=1</text>
  <text x="260" y="1080" class="small">两个 Command 写入 Blackboard.execution.tasks</text>

  <g filter="url(#shadow)">
    <rect x="1250" y="760" width="420" height="205" rx="20" fill="#EEE9FA" stroke="#8C7DB8" stroke-width="2"/>
  </g>
  <text x="1285" y="804" class="dbH">MySQL：checkpoints</text>
  <text x="1285" y="840" class="dbT">保存最新 Blackboard JSON</text>
  <text x="1285" y="871" class="dbT">当前 stage + revision</text>
  <text x="1285" y="902" class="dbT">当前 execution.tasks</text>
  <text x="1285" y="933" class="dbT">同一 requestId 更新同一行</text>
  <path d="M1070 1015 C1170 1015 1150 860 1245 860" class="audit"/>

  <g filter="url(#shadow)">
    <rect x="1250" y="995" width="420" height="205" rx="20" fill="#EEE9FA" stroke="#8C7DB8" stroke-width="2"/>
  </g>
  <text x="1285" y="1039" class="dbH">MySQL：runtime_events</text>
  <text x="1285" y="1075" class="dbT">追加 TURN_STARTED</text>
  <text x="1285" y="1106" class="dbT">追加 STATE_UPDATED</text>
  <text x="1285" y="1137" class="dbT">以后继续追加开始/完成记录</text>
  <text x="1285" y="1168" class="dbT">不从这里读取下一步</text>
  <path d="M1070 1060 C1150 1060 1170 1100 1245 1100" class="audit"/>

  <!-- 5 dispatcher parallel -->
  <path d="M620 1100 L620 1145" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="1155" width="900" height="205" rx="20" fill="#FFF7E8" stroke="#E09A2D" stroke-width="3"/>
  </g>
  <circle cx="215" cy="1255" r="25" fill="#D88916"/><text x="215" y="1263" class="num">5</text>
  <text x="260" y="1197" class="h">Dispatcher 并行执行两个 Command</text>
  <rect x="265" y="1225" width="355" height="92" rx="15" fill="#FFF0D7" stroke="#E09A2D"/>
  <text x="292" y="1260" class="body">UnderstandingAgent</text>
  <text x="292" y="1293" class="small">返回 intent=CONSULT</text>
  <rect x="650" y="1225" width="355" height="92" rx="15" fill="#FFF0D7" stroke="#E09A2D"/>
  <text x="677" y="1260" class="body">SafetyAgent</text>
  <text x="677" y="1293" class="small">返回 risk=LOW</text>
  <text x="260" y="1342" class="small">每个 Agent 读取 revision=1 的独立业务快照</text>

  <!-- 6 receipts -->
  <path d="M620 1360 L620 1400" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="1410" width="900" height="160" rx="20" fill="#DCEBFF" stroke="#2463A7" stroke-width="3"/>
  </g>
  <circle cx="215" cy="1490" r="25" fill="#2463A7"/><text x="215" y="1498" class="num">6</text>
  <text x="260" y="1452" class="h">Runtime 校验并逐个保存 Outcome 收据</text>
  <text x="260" y="1490" class="body">校验 commandId、输入 revision、Schema、分区写权限</text>
  <text x="260" y="1524" class="body">先写 execution.tasks[commandId].outcome</text>
  <text x="260" y="1555" class="small">此刻业务 understanding / safety 还没有合并</text>
  <path d="M1070 1490 C1180 1490 1145 1120 1245 1120" class="audit"/>
  <path d="M1070 1530 C1170 1530 1160 920 1245 920" class="audit"/>

  <!-- 7 barrier -->
  <path d="M620 1570 L620 1610" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="1620" width="900" height="125" rx="20" fill="#EAF3FF" stroke="#5B91CB" stroke-width="2"/>
  </g>
  <circle cx="215" cy="1680" r="25" fill="#2463A7"/><text x="215" y="1688" class="num">7</text>
  <text x="260" y="1665" class="h">唯一完成屏障</text>
  <text x="260" y="1702" class="body">all(task.outcome != null) → 批量合并 understanding + safety</text>

  <!-- 8 route -->
  <path d="M620 1745 L620 1785" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="1795" width="900" height="135" rx="20" fill="#DCEBFF" stroke="#2463A7" stroke-width="3"/>
  </g>
  <circle cx="215" cy="1860" r="25" fill="#2463A7"/><text x="215" y="1868" class="num">8</text>
  <text x="260" y="1840" class="h">Coordinator 选择 CONSULT 路线</text>
  <text x="260" y="1878" class="body">intent=CONSULT + risk=LOW → stage=RETRIEVING</text>
  <text x="260" y="1910" class="small">同时创建 ContextAgent / GATHER_CONTEXT 命令</text>

  <!-- 9 Context -->
  <path d="M620 1930 L620 1970" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="1980" width="900" height="155" rx="20" fill="#FFF7E8" stroke="#E09A2D" stroke-width="3"/>
  </g>
  <circle cx="215" cy="2055" r="25" fill="#D88916"/><text x="215" y="2063" class="num">9</text>
  <text x="260" y="2022" class="h">ContextAgent 整理上下文</text>
  <text x="260" y="2060" class="body">近期会话 → 摘要 → RAG 查询 → 重排 → 选择 Skill</text>
  <text x="260" y="2095" class="small">返回 context StateUpdate；Runtime 保存收据、合并、推进</text>

  <g filter="url(#shadow)">
    <rect x="1250" y="1810" width="420" height="145" rx="20" fill="#E4F5EB" stroke="#419A68" stroke-width="2"/>
  </g>
  <text x="1285" y="1853" class="dbH">Redis：近期会话记忆</text>
  <text x="1285" y="1890" class="dbT">按 Session 保存，有 TTL</text>
  <text x="1285" y="1921" class="dbT">不保存工作流进度</text>

  <g filter="url(#shadow)">
    <rect x="1250" y="1980" width="420" height="155" rx="20" fill="#E4F5EB" stroke="#419A68" stroke-width="2"/>
  </g>
  <text x="1285" y="2023" class="dbH">知识检索</text>
  <text x="1285" y="2060" class="dbT">MySQL：knowledge_chunks 权威正文</text>
  <text x="1285" y="2091" class="dbT">Chroma：派生向量索引</text>
  <path d="M1070 2045 C1150 2045 1175 1880 1245 1880" class="thin"/>
  <path d="M1070 2080 L1245 2080" class="thin"/>

  <!-- 10 Response -->
  <path d="M620 2135 L620 2175" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="2185" width="900" height="145" rx="20" fill="#FFF7E8" stroke="#E09A2D" stroke-width="3"/>
  </g>
  <circle cx="215" cy="2255" r="25" fill="#D88916"/><text x="215" y="2263" class="num">10</text>
  <text x="260" y="2227" class="h">ResponseAgent 组装候选 Prompt</text>
  <text x="260" y="2265" class="body">messages + prompt_version=1 + prompt_hash + 安全契约</text>
  <text x="260" y="2298" class="small">此处只准备 Prompt，还没有生成最终自然语言</text>

  <!-- 11 Review -->
  <path d="M620 2330 L620 2370" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="2380" width="900" height="145" rx="20" fill="#FFF7E8" stroke="#E09A2D" stroke-width="3"/>
  </g>
  <circle cx="215" cy="2450" r="25" fill="#D88916"/><text x="215" y="2458" class="num">11</text>
  <text x="260" y="2422" class="h">SafetyAgent 审核真实 Prompt v1</text>
  <text x="260" y="2460" class="body">approved=true 且 review.version == response.version</text>
  <text x="260" y="2493" class="small">Coordinator 确定性进入 READY_FOR_GENERATION</text>

  <!-- 12 LLM -->
  <path d="M620 2525 L620 2565" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="2575" width="900" height="145" rx="20" fill="#FFF0D7" stroke="#D88916" stroke-width="3"/>
  </g>
  <circle cx="215" cy="2645" r="25" fill="#D88916"/><text x="215" y="2653" class="num">12</text>
  <text x="260" y="2617" class="h">最终模型生成回复</text>
  <text x="260" y="2655" class="body">checkpoint 先记 GENERATING → LLM 流式返回 token</text>
  <text x="260" y="2688" class="small">CONSULT 回复在 ChatService 内存完整缓冲并检查</text>

  <!-- 13 finalization -->
  <path d="M620 2720 L620 2760" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="2770" width="900" height="140" rx="20" fill="#DCEBFF" stroke="#2463A7" stroke-width="3"/>
  </g>
  <circle cx="215" cy="2840" r="25" fill="#2463A7"/><text x="215" y="2848" class="num">13</text>
  <text x="260" y="2812" class="h">保存已检查的完整文字</text>
  <text x="260" y="2850" class="body">response.final_response → stage=FINALIZING_RESPONSE</text>
  <text x="260" y="2883" class="small">先写 checkpoint，再保存业务消息和工具任务</text>
  <path d="M1070 2840 C1160 2840 1160 900 1245 900" class="audit"/>

  <g filter="url(#shadow)">
    <rect x="1250" y="2485" width="420" height="265" rx="20" fill="#EEE9FA" stroke="#8C7DB8" stroke-width="2"/>
  </g>
  <text x="1285" y="2528" class="dbH">每次转换的原子提交</text>
  <text x="1285" y="2565" class="dbT">checkpoint：更新最新状态</text>
  <text x="1285" y="2597" class="dbT">Event：追加一条审计历史</text>
  <text x="1285" y="2629" class="dbT">任务结果先存收据，再合并</text>
  <text x="1285" y="2661" class="dbT">Event 在内存只停留本次请求</text>
  <text x="1285" y="2693" class="dbT">数据库 Event 默认持续保留</text>

  <!-- 14 business -->
  <path d="M620 2910 L620 2950" class="flow"/>
  <g filter="url(#shadow)">
    <rect x="170" y="2960" width="900" height="105" rx="20" fill="#E7F6ED" stroke="#419A68" stroke-width="3"/>
  </g>
  <circle cx="215" cy="3012" r="25" fill="#348557"/><text x="215" y="3020" class="num">14</text>
  <text x="260" y="3000" class="h">业务保存完成 → COMPLETED → SSE 输出</text>
  <text x="260" y="3037" class="body">chat_messages + Redis 记忆 + tool_jobs/outbox + materialization</text>

  <g filter="url(#shadow)">
    <rect x="1250" y="2800" width="420" height="265" rx="20" fill="#EEE9FA" stroke="#8C7DB8" stroke-width="2"/>
  </g>
  <text x="1285" y="2843" class="dbH">最终业务存储</text>
  <text x="1285" y="2880" class="dbT">MySQL chat_messages：正式回复</text>
  <text x="1285" y="2912" class="dbT">MySQL materializations：落地收据</text>
  <text x="1285" y="2944" class="dbT">MySQL tool_jobs：工具状态/重试</text>
  <text x="1285" y="2976" class="dbT">MySQL tool_outbox + Redis Stream：可靠投递</text>
  <text x="1285" y="3008" class="dbT">Redis：近期聊天记忆；checkpoint：COMPLETED</text>
  <path d="M1070 3012 L1245 2940" class="audit"/>

  <rect x="80" y="3110" width="1640" height="45" rx="16" fill="#17385F"/>
  <text x="900" y="3140" text-anchor="middle" style="font:700 19px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif;fill:#fff">
    核心：Checkpoint 保存“现在到哪”，Event 保存“以前发生过什么”，两者都落 MySQL；workflow-v2 不使用 Event 队列
  </text>
</svg>
